<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>ER Workflow Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: แถบหัว + ตัวกรอง แล้วกระดาน 4 คอลัมน์ตามสถานะ (มือถือ = เลื่อนแนวนอนในกระดาน) */
:root {
  --bg: #F0F4F9;
  --panel: #FFFFFF;
  --line: #DADCE0;
  --line-soft: #E8EAED;
  --ink: #1F2937;
  --ink-2: #4B5563;
  --ink-3: #6B7280;
  --navy: #1A3A8B;
  --navy-soft: #E8F0FE;
  --doc: #1A3A8B;
  --doc-soft: #E8F0FE;
  --nurse: #0F766E;
  --nurse-soft: #E1F3F1;
  --done: #1E9E5A;
  --danger: #C5221F;
  --danger-soft: #FCE8E6;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1420; --panel: #171E2D; --line: #2C3547; --line-soft: #232B3B;
    --ink: #E8ECF3; --ink-2: #B8C0CF; --ink-3: #8C96A8;
    --navy: #8AB4F8; --navy-soft: #1E2A44;
    --doc: #8AB4F8; --doc-soft: #1E2A44; --nurse: #5EC9BC; --nurse-soft: #15302D;
    --done: #57C08A; --danger: #F28B82; --danger-soft: #3A1E1D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1420; --panel: #171E2D; --line: #2C3547; --line-soft: #232B3B;
  --ink: #E8ECF3; --ink-2: #B8C0CF; --ink-3: #8C96A8;
  --navy: #8AB4F8; --navy-soft: #1E2A44;
  --doc: #8AB4F8; --doc-soft: #1E2A44; --nurse: #5EC9BC; --nurse-soft: #15302D;
  --done: #57C08A; --danger: #F28B82; --danger-soft: #3A1E1D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-weight: 500; font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 28px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
.stats { display: flex; gap: 14px; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 700; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 100px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--navy-soft); color: var(--navy); border-color: transparent; }
.chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--navy); outline-offset: 2px;
}
.spacer { flex: 1; }
.btn {
  border: 0; border-radius: 100px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer;
  background: var(--navy); color: var(--panel);
}
.btn.ghost { background: var(--panel); color: var(--ink-2); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  display: flex; flex-direction: column; min-height: 240px; min-width: 0;
}
.col-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; }
.col-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.count { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); background: var(--bg); border-radius: 100px; padding: 1px 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.col[data-s="doing"] .dot { background: var(--navy); }
.col[data-s="review"] .dot { background: #E37400; }
.col[data-s="done"] .dot { background: var(--done); }
.list { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 12px; min-height: 80px; border-radius: 12px; }
.list.over { background: var(--navy-soft); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px; cursor: grab; min-width: 0;
}
.card:hover { border-color: var(--ink-3); }
.card.dragging { opacity: .45; }
.card .t { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; white-space: pre-line; }
.done .card .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 1px 7px; }
.tag.doctor { background: var(--doc-soft); color: var(--doc); }
.tag.nurse { background: var(--nurse-soft); color: var(--nurse); }
.area { font-size: 12px; color: var(--ink-3); }
.from { font-size: 11.5px; font-weight: 600; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.proof { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.proof figure { margin: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.proof img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line-soft); background: var(--bg); display: block; }
.proof figcaption { font-size: 11px; color: var(--ink-3); font-weight: 600; }
.badge-proof { font-size: 11px; font-weight: 700; color: var(--done); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot .head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.slot .pic { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--ink-3); font-size: 12.5px; text-align: center; padding: 6px; }
.slot .pic img { width: 100%; height: 100%; object-fit: contain; }
.slot .pic.has { border-style: solid; padding: 0; }
.mini { border: 0; background: none; color: var(--navy); font: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer; padding: 2px 4px; }
.mini.del { color: var(--danger); }
.cmp { position: fixed; inset: 0; background: #0B1220; z-index: 30; display: flex; flex-direction: column; color: #E8ECF3; }
.cmp-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; }
.cmp-top h3 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.seg { display: flex; background: #1B2436; border-radius: 100px; padding: 3px; }
.seg button { border: 0; background: none; color: #B8C0CF; font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 100px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #E8F0FE; color: #1A3A8B; }
.cmp-x { border: 0; background: #1B2436; color: #E8ECF3; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.cmp-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px 8px; }
.cmp-slide { position: relative; max-width: 100%; max-height: 100%; user-select: none; touch-action: none; }
.cmp-slide img { display: block; max-width: 100%; max-height: calc(100vh - 150px); border-radius: 8px; }
.cmp-slide .top { position: absolute; inset: 0; overflow: hidden; border-radius: 8px; }
.cmp-slide .top img { max-width: none; max-height: none; height: 100%; width: auto; }
.cmp-handle { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; transform: translateX(-1px); pointer-events: none; }
.cmp-handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #1A3A8B; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.cmp-tag { position: absolute; top: 10px; padding: 3px 10px; border-radius: 100px; font-size: 12.5px; font-weight: 700; background: rgba(11,18,32,.75); color: #fff; pointer-events: none; }
.cmp-side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-height: 100%; }
.cmp-side figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmp-side img { width: 100%; max-height: calc(100vh - 170px); object-fit: contain; border-radius: 8px; background: #000; }
.cmp-side figcaption { font-weight: 700; font-size: 13px; }
.cmp-hint { text-align: center; font-size: 12.5px; color: #8C96A8; padding: 0 16px 14px; }
.cmp-btn { border: 0; border-radius: 100px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: 12px; cursor: pointer; background: var(--navy); color: var(--panel); }
@media (max-width: 720px) { .cmp-side { grid-template-columns: 1fr; overflow: auto; } }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.empty { color: var(--ink-3); font-size: 13px; padding: 10px 6px; text-align: center; }
.loading { color: var(--ink-3); padding: 24px; text-align: center; }
/* แผ่นแก้ไข/เพิ่มการ์ด */
.sheet-bg { position: fixed; inset: 0; background: rgba(11,27,63,.32); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--panel); border-radius: 20px; width: min(520px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow: auto; }
.sheet h3 { margin: 0; font-size: 17px; font-weight: 700; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid transparent;
  border-radius: 10px; padding: 9px 11px; font-weight: 500;
}
textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .left { margin-right: auto; }
.note { color: var(--ink-3); font-size: 12.5px; }
.ro { color: var(--ink-3); font-size: 13px; }
@media (max-width: 720px) {
  .board { grid-template-columns: repeat(4, 82%); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>ER Workflow Board</h1>
      <p class="sub">รายการปรับเมนู workflow แพทย์และพยาบาล จากรีวิว 19 ต.ค. 2569 · แตะการ์ดเพื่อดูภาพก่อน/หลังแก้ (ฉบับอ่านอย่างเดียว)</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <button class="chip" data-f="all" aria-pressed="true">ทั้งหมด</button>
    <button class="chip" data-f="doctor" aria-pressed="false">แพทย์</button>
    <button class="chip" data-f="nurse" aria-pressed="false">พยาบาล</button>
    <select id="areaFilter" class="chip" aria-label="กรองตามส่วน"><option value="">ทุกส่วน</option></select>
    <span class="spacer"></span>
    <button class="btn" id="addBtn">+ เพิ่มงาน</button>
  </div>

  <div class="board" id="board">
    <section class="col" data-s="todo"><div class="col-head"><span class="dot"></span><h2>ต้องทำ</h2><span class="count"></span></div><div class="list"></div></section>
    <section class="col" data-s="doing"><div class="col-head"><span class="dot"></span><h2>กำลังทำ</h2><span class="count"></span></div><div class="list"></div></section>
    <section class="col" data-s="review"><div class="col-head"><span class="dot"></span><h2>รอรีวิว</h2><span class="count"></span></div><div class="list"></div></section>
    <section class="col done" data-s="done"><div class="col-head"><span class="dot"></span><h2>เสร็จแล้ว</h2><span class="count"></span></div><div class="list"></div></section>
  </div>
  <p class="note" id="note">กำลังโหลดรายการ…</p>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="sheet">
    <h3 id="sheetTitle">แก้ไขงาน</h3>
    <label for="fTitle">งาน<textarea id="fTitle" required></textarea></label>
    <div class="row2">
      <label for="fGroup">ฝั่ง<select id="fGroup"><option value="doctor">แพทย์</option><option value="nurse">พยาบาล</option></select></label>
      <label for="fStatus">สถานะ<select id="fStatus"><option value="todo">ต้องทำ</option><option value="doing">กำลังทำ</option><option value="review">รอรีวิว</option><option value="done">เสร็จแล้ว</option></select></label>
    </div>
    <label for="fArea">ส่วน<input id="fArea" list="areaList" placeholder="เช่น วาดภาพ, หัตถการ"></label>
    <datalist id="areaList"></datalist>
    <label for="fNote">หมายเหตุ<textarea id="fNote"></textarea></label>
    <button type="button" class="cmp-btn" id="cmpOpen" hidden>เทียบก่อน/หลัง</button>
    <div class="slots" id="slots">
      <div class="slot" data-k="beforeId"><div class="head"><span>ภาพก่อนแก้</span><span class="ctl"></span></div><div class="pic"></div></div>
      <div class="slot" data-k="afterId"><div class="head"><span>ภาพหลังแก้</span><span class="ctl"></span></div><div class="pic"></div></div>
    </div>
    <input type="file" id="fileIn" accept="image/*" hidden>
    <div class="actions">
      <button type="button" class="btn danger left" id="delBtn">ลบ</button>
      <button type="button" class="btn danger left" id="delYes" hidden>ยืนยันลบ</button>
      <button type="button" class="btn ghost" id="cancelBtn">ยกเลิก</button>
      <button type="submit" class="btn" id="saveBtn">บันทึก</button>
    </div>
  </form>
</div>

<div class="lightbox" id="lightbox" hidden onclick="this.hidden=true"><img alt="ภาพหลักฐาน"></div>

<div class="cmp" id="cmp" hidden>
  <div class="cmp-top">
    <h3 id="cmpTitle"></h3>
    <div class="seg" role="group" aria-label="วิธีเทียบ">
      <button type="button" data-m="slide" aria-pressed="true">เลื่อนเทียบ</button>
      <button type="button" data-m="side" aria-pressed="false">คู่กัน</button>
      <button type="button" data-m="flip" aria-pressed="false">สลับ</button>
    </div>
    <button type="button" class="cmp-x" id="cmpClose" aria-label="ปิด">✕</button>
  </div>
  <div class="cmp-stage" id="cmpStage"></div>
  <div class="cmp-hint" id="cmpHint"></div>
</div>

<script>
const STATUS = ['todo', 'doing', 'review', 'done'];
let cards = [];          // {id, title, group, area, status, order, note}
let filter = 'all', areaF = '';
let db = null, col = null, canWrite = false, assets = null;
let editing = null;      // id ที่กำลังแก้ · 'new' = เพิ่มใหม่

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const blob = (id) => 'img/' + encodeURIComponent(id) + '.jpg';
const pic = (id, cap) => id ? `<figure><img src="${blob(id)}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption></figure>` : `<figure><div></div></figure>`;

function render() {
  const shown = cards.filter(c => (filter === 'all' || c.group === filter) && (!areaF || c.area === areaF));
  for (const s of STATUS) {
    const colEl = document.querySelector(`.col[data-s="${s}"]`);
    const list = colEl.querySelector('.list');
    const items = shown.filter(c => c.status === s).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    colEl.querySelector('.count').textContent = items.length;
    list.innerHTML = items.length ? items.map(c => `
      <article class="card" draggable="${canWrite}" data-id="${esc(c.id)}" tabindex="0">
        <div class="t">${esc(c.title)}</div>
        <div class="meta">
          <span class="tag ${c.group === 'nurse' ? 'nurse' : 'doctor'}">${c.group === 'nurse' ? 'พยาบาล' : 'แพทย์'}</span>
          ${c.area ? `<span class="area">${esc(c.area)}</span>` : ''}
          ${c.from ? `<span class="from">${esc(c.from)}</span>` : ''}
          ${c.beforeId && c.afterId ? '<span class="badge-proof">มีหลักฐานก่อน/หลัง</span>' : ''}
        </div>
        ${c.beforeId || c.afterId ? `<div class="proof" data-cmp="${esc(c.id)}">
          ${pic(c.beforeId, 'ก่อน')}${pic(c.afterId, 'หลัง')}
        </div>` : ''}
        ${c.beforeId && c.afterId ? `<div><button type="button" class="cmp-btn" data-cmp="${esc(c.id)}">เทียบก่อน/หลัง</button></div>` : ''}
      </article>`).join('') : '<div class="empty">ไม่มีงาน</div>';
  }
  const total = cards.length, done = cards.filter(c => c.status === 'done').length;
  $('#stats').innerHTML = `<span>ทั้งหมด <b>${total}</b></span><span>เสร็จ <b>${done}</b></span><span>เหลือ <b>${total - done}</b></span>`;
  const areas = [...new Set(cards.map(c => c.area).filter(Boolean))];
  const sel = $('#areaFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">ทุกส่วน</option>' + areas.map(a => `<option ${a === cur ? 'selected' : ''}>${esc(a)}</option>`).join('');
  $('#areaList').innerHTML = areas.map(a => `<option value="${esc(a)}">`).join('');
  $('#addBtn').hidden = !canWrite;
}

// ---- ลากการ์ด (เดสก์ท็อป) · มือถือใช้แตะแล้วเปลี่ยนสถานะในแผ่นแก้ไข
let dragId = null;
document.addEventListener('dragstart', e => {
  const c = e.target.closest?.('.card'); if (!c) return;
  dragId = c.dataset.id; c.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {}
});
document.addEventListener('dragend', e => { e.target.closest?.('.card')?.classList.remove('dragging'); document.querySelectorAll('.list.over').forEach(l => l.classList.remove('over')); });
document.querySelectorAll('.list').forEach(list => {
  list.addEventListener('dragover', e => { if (!dragId) return; e.preventDefault(); list.classList.add('over'); });
  list.addEventListener('dragleave', () => list.classList.remove('over'));
  list.addEventListener('drop', e => {
    e.preventDefault(); list.classList.remove('over');
    const s = list.closest('.col').dataset.s;
    const c = cards.find(x => x.id === dragId); dragId = null;
    if (!c || c.status === s) return;
    // วางท้ายคอลัมน์ตามตำแหน่งที่ปล่อย
    const after = [...list.querySelectorAll('.card')].filter(el => el.getBoundingClientRect().top + el.offsetHeight / 2 < e.clientY);
    const peers = cards.filter(x => x.status === s).sort((a, b) => a.order - b.order);
    const prev = after.length ? cards.find(x => x.id === after[after.length - 1].dataset.id) : null;
    const next = peers[prev ? peers.indexOf(prev) + 1 : 0];
    const order = prev && next ? (prev.order + next.order) / 2 : prev ? prev.order + 1 : next ? next.order - 1 : 0;
    save(c.id, { status: s, order });
  });
});

document.addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) openSheet(c.dataset.id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('card')) openSheet(e.target.dataset.id);
  if (e.key === 'Escape') closeSheet();
});
document.querySelectorAll('.chip[data-f]').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.chip[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
$('#areaFilter').addEventListener('change', e => { areaF = e.target.value; render(); });

// ---- แผ่นแก้ไข
function openSheet(id) {
  editing = id;
  const c = id === 'new' ? { title: '', group: filter === 'nurse' ? 'nurse' : 'doctor', area: areaF, status: 'todo', note: '' } : cards.find(x => x.id === id);
  if (!c) return;
  $('#sheetTitle').textContent = id === 'new' ? 'เพิ่มงาน' : (canWrite ? 'แก้ไขงาน' : 'รายละเอียดงาน');
  $('#fTitle').value = c.title; $('#fGroup').value = c.group; $('#fStatus').value = c.status;
  $('#fArea').value = c.area || ''; $('#fNote').value = c.note || '';
  ['#fTitle', '#fGroup', '#fStatus', '#fArea', '#fNote'].forEach(s => $(s).disabled = !canWrite);
  $('#delBtn').hidden = id === 'new' || !canWrite; $('#delYes').hidden = true;
  $('#saveBtn').hidden = !canWrite;
  renderSlots(id === 'new' ? null : c);
  $('#sheetBg').hidden = false;
  setTimeout(() => $('#fTitle').focus(), 0);
}
// ช่องภาพก่อน/หลัง: แตะภาพ = ดูเต็มจอ · ผู้แก้ไขอัปโหลด/เปลี่ยน/เอาออกได้
function renderSlots(c) {
  $('#slots').hidden = !c;
  $('#cmpOpen').hidden = !(c && c.beforeId && c.afterId);
  if (!c) return;
  document.querySelectorAll('.slot').forEach(sl => {
    const k = sl.dataset.k, id = c[k];
    const box = sl.querySelector('.pic');
    box.className = 'pic' + (id ? ' has' : '');
    box.innerHTML = id ? `<img src="${blob(id)}" alt="">` : (assets ? 'ยังไม่มีภาพ' : 'ยังไม่มีภาพ');
    const ctl = sl.querySelector('.ctl');
    ctl.innerHTML = assets
      ? `<button type="button" class="mini" data-up="${k}">${id ? 'เปลี่ยน' : 'อัปโหลด'}</button>` + (id ? `<button type="button" class="mini del" data-rm="${k}">เอาออก</button>` : '')
      : '';
  });
}
// ---- เทียบก่อน/หลัง: เลื่อนเส้นแบ่ง · คู่กัน · สลับ (แตะ/Space สลับภาพในตำแหน่งเดียวกัน)
let cmpCard = null, cmpMode = 'slide', cmpPos = 50, cmpShowAfter = true;
function openCmp(id) {
  cmpCard = cards.find(x => x.id === id);
  if (!cmpCard || !cmpCard.beforeId || !cmpCard.afterId) return;
  $('#cmpTitle').textContent = cmpCard.title;
  cmpPos = 50; cmpShowAfter = true;
  $('#cmp').hidden = false;
  drawCmp();
}
function closeCmp() { $('#cmp').hidden = true; cmpCard = null; }
function drawCmp() {
  const c = cmpCard; if (!c) return;
  const b = blob(c.beforeId), a = blob(c.afterId);
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === cmpMode)));
  const st = $('#cmpStage');
  if (cmpMode === 'side') {
    st.innerHTML = `<div class="cmp-side"><figure><figcaption>ก่อนแก้</figcaption><img src="${b}" alt="ก่อนแก้"></figure><figure><figcaption>หลังแก้</figcaption><img src="${a}" alt="หลังแก้"></figure></div>`;
    $('#cmpHint').textContent = 'ภาพก่อนซ้าย หลังขวา';
  } else if (cmpMode === 'flip') {
    st.innerHTML = `<div class="cmp-slide" id="flipBox"><img src="${cmpShowAfter ? a : b}" alt=""><span class="cmp-tag" style="left:10px">${cmpShowAfter ? 'หลังแก้' : 'ก่อนแก้'}</span></div>`;
    $('#cmpHint').textContent = 'แตะภาพหรือกด Space เพื่อสลับ ก่อน ↔ หลัง ในตำแหน่งเดียวกัน';
    $('#flipBox').onclick = () => { cmpShowAfter = !cmpShowAfter; drawCmp(); };
  } else {
    // ภาพหลังอยู่ล่าง ภาพก่อนอยู่บน ตัดตามเส้นแบ่ง
    st.innerHTML = `<div class="cmp-slide" id="slideBox"><img src="${a}" alt="หลังแก้" id="slBase"><div class="top" id="slTop"><img src="${b}" alt="ก่อนแก้"></div><div class="cmp-handle" id="slHandle"></div><span class="cmp-tag" style="left:10px">ก่อน</span><span class="cmp-tag" style="right:10px">หลัง</span></div>`;
    $('#cmpHint').textContent = 'ลากบนภาพ หรือกด ← → เพื่อเลื่อนเส้นแบ่ง';
    const box = $('#slideBox'), base = $('#slBase');
    const place = () => {
      const w = base.clientWidth, h = base.clientHeight;
      $('#slTop').style.width = (cmpPos / 100 * w) + 'px';
      $('#slTop').querySelector('img').style.height = h + 'px';
      $('#slTop').querySelector('img').style.width = w + 'px';
      $('#slHandle').style.left = (cmpPos / 100 * w) + 'px';
    };
    base.onload = place; place();
    let down = false;
    const move = (e) => {
      const r = box.getBoundingClientRect();
      cmpPos = Math.max(0, Math.min(100, (e.clientX - r.left) / r.width * 100));
      place();
    };
    box.onpointerdown = (e) => { down = true; box.setPointerCapture(e.pointerId); move(e); };
    box.onpointermove = (e) => { if (down) move(e); };
    box.onpointerup = () => { down = false; };
    window.onresize = place;
  }
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { cmpMode = b.dataset.m; drawCmp(); }));
$('#cmpClose').addEventListener('click', closeCmp);
$('#cmpOpen').addEventListener('click', () => { const id = editing; closeSheet(); openCmp(id); });
document.addEventListener('keydown', e => {
  if ($('#cmp').hidden) return;
  if (e.key === 'Escape') closeCmp();
  if (cmpMode === 'slide' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { cmpPos = Math.max(0, Math.min(100, cmpPos + (e.key === 'ArrowLeft' ? -5 : 5))); drawCmp(); }
  if (cmpMode === 'flip' && e.key === ' ') { e.preventDefault(); cmpShowAfter = !cmpShowAfter; drawCmp(); }
});

let upKey = null;
document.addEventListener('click', e => {
  const up = e.target.closest('[data-up]');
  if (up) { upKey = up.dataset.up; $('#fileIn').value = ''; $('#fileIn').click(); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm && editing) { save(editing, { [rm.dataset.rm]: null }).then(() => renderSlots(cards.find(x => x.id === editing))); return; }
  const cb = e.target.closest('[data-cmp]');
  if (cb) { const cc = cards.find(x => x.id === cb.dataset.cmp); if (cc && cc.beforeId && cc.afterId) { e.stopPropagation(); openCmp(cb.dataset.cmp); return; } }
  const im = e.target.closest('.pic.has img, .proof img');
  if (im) { e.stopPropagation(); const lb = $('#lightbox'); lb.querySelector('img').src = im.src; lb.hidden = false; }
}, true);
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; const id = editing, k = upKey;
  if (!f || !id || id === 'new') return;
  try {
    note('กำลังอัปโหลดภาพ…');
    const r = await assets.upload(f);
    await save(id, { [k]: r.id });
    renderSlots(cards.find(x => x.id === id));
    note('อัปโหลดภาพแล้ว');
  } catch (err) { note('อัปโหลดไม่สำเร็จ: ' + (err.message || err.code)); }
});

function closeSheet() { $('#sheetBg').hidden = true; editing = null; }
$('#cancelBtn').addEventListener('click', closeSheet);
$('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); });
$('#addBtn').addEventListener('click', () => openSheet('new'));
$('#delBtn').addEventListener('click', () => { $('#delBtn').hidden = true; $('#delYes').hidden = false; });
$('#delYes').addEventListener('click', async () => {
  const id = editing; closeSheet();
  try { await col.doc(id).delete(); } catch (err) { note('ลบไม่สำเร็จ: ' + (err.message || err.code)); }
});
$('#sheet').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    title: $('#fTitle').value.trim(), group: $('#fGroup').value, status: $('#fStatus').value,
    area: $('#fArea').value.trim(), note: $('#fNote').value.trim(),
  };
  if (!data.title) return;
  const id = editing; closeSheet();
  if (id === 'new') {
    const peers = cards.filter(x => x.status === data.status);
    data.order = peers.length ? Math.max(...peers.map(x => x.order ?? 0)) + 1 : 0;
    try { await col.add(data); } catch (err) { note('เพิ่มไม่สำเร็จ: ' + (err.message || err.code)); }
  } else save(id, data);
});

async function save(id, patch) {
  const c = cards.find(x => x.id === id); if (!c) return;
  Object.assign(c, patch); render();               // แสดงทันที แล้วค่อยบันทึก
  try { await col.doc(id).update(patch); } catch (err) { note('บันทึกไม่สำเร็จ: ' + (err.message || err.code)); }
}
function note(t) { $('#note').textContent = t; }
